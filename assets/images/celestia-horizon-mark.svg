<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none" role="img" aria-label="Celestia Inn emblem">
  <defs>
    <linearGradient id="chGold-m" x1="12%" y1="4%" x2="88%" y2="96%">
      <stop offset="0%" stop-color="#FFF2D6" />
      <stop offset="28%" stop-color="#E9C176" />
      <stop offset="62%" stop-color="#C5A059" />
      <stop offset="84%" stop-color="#FFDEA5" />
      <stop offset="100%" stop-color="#9E7831" />
    </linearGradient>
    <linearGradient id="chRidge-m" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E9C176" stop-opacity="0.30" />
      <stop offset="100%" stop-color="#9E7831" stop-opacity="0.06" />
    </linearGradient>
    <radialGradient id="chSky-m" cx="50%" cy="26%" r="52%">
      <stop offset="0%" stop-color="#FFE7B3" stop-opacity="0.20" />
      <stop offset="100%" stop-color="#C5A059" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- sky glow -->
  <circle cx="50" cy="40" r="34" fill="url(#chSky-m)" />

  <!-- medallion -->
  <circle cx="50" cy="50" r="46" stroke="url(#chGold-m)" stroke-width="1.6" />
  <circle cx="50" cy="50" r="41.5" stroke="url(#chGold-m)" stroke-width="0.5" stroke-opacity="0.40" />

  <!-- range -->
  <path d="M 13 66 L 30 46 L 40 56 L 50 31 L 62 47 L 71 39 L 87 66 Z" fill="url(#chRidge-m)" />
  <path d="M 13 66 L 30 46 L 40 56 L 50 31 L 62 47 L 71 39 L 87 66"
        stroke="url(#chGold-m)" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" />

  <!-- snowline on the dominant peak -->
  <path d="M 50 31 L 56 39 L 53.5 37 L 51 40 L 48.5 36.5 L 46.5 39.75 Z" fill="url(#chGold-m)" fill-opacity="0.85" />

  <!-- horizon -->
  <line x1="13" y1="66" x2="87" y2="66" stroke="url(#chGold-m)" stroke-width="1.8" stroke-linecap="round" />

  <!-- compass star -->
  <polygon points="50,10.5 50.80,16.06 53.54,14.46 51.94,17.20 57.5,18 51.94,18.80 53.54,21.54 50.80,19.94 50,25.5 49.20,19.94 46.46,21.54 48.06,18.80 42.5,18 48.06,17.20 46.46,14.46 49.20,16.06"
           fill="url(#chGold-m)" />
  <circle cx="50" cy="18" r="1.05" fill="#FFF5E0" />
</svg>
