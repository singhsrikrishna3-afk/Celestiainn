<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 80" fill="none" role="img" aria-label="Celestia Inn — Homestays &amp; Boutique Inns">
  <defs>
    <linearGradient id="chGold-h" x1="6%" y1="0%" x2="94%" y2="100%">
