    <circle cx="50" cy="50" r="41.5" stroke="url(#chGold-h)" stroke-width="0.5" stroke-opacity="0.40" />
    <path d="M 13 66 L 30 46 L 40 56 L 50 31 L 62 47 L 71 39 L 87 66 Z" fill="url(#chRidge-h)" />
