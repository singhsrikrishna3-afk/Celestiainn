  <polygon points="244,53 246.6,50.4 249.2,53 246.6,55.6" fill="url(#chGold-h)" fill-opacity="0.8" />
  <line x1="257" y1="53" x2="328" y2="53" stroke="url(#chGold-h)" stroke-width="0.6" stroke-opacity="0.45" />

