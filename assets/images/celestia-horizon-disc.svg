<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none" role="img" aria-label="Celestia Inn">
  <defs>
    <linearGradient id="chGold-d" x1="8%" y1="0%" x2="92%" y2="100%">
      <stop offset="0%" stop-color="#FFF2D6" />
      <stop offset="28%" stop-color="#E9C176" />
      <stop offset="62%" stop-color="#C5A059" />
      <stop offset="84%" stop-color="#FFDEA5" />
      <stop offset="100%" stop-color="#9E7831" />
    </linearGradient>
    <linearGradient id="chRidge-d" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E9C176" stop-opacity="0.34" />
      <stop offset="100%" stop-color="#9E7831" stop-opacity="0.08" />
    </linearGradient>
    <radialGradient id="chDisc-d" cx="50%" cy="34%" r="72%">
      <stop offset="0%" stop-color="#2A2420" />
      <stop offset="100%" stop-color="#141210" />
    </radialGradient>
  </defs>

  <!-- solid ground: crops cleanly to a circular avatar -->
  <circle cx="100" cy="100" r="100" fill="url(#chDisc-d)" />
  <circle cx="100" cy="100" r="92" stroke="url(#chGold-d)" stroke-width="1.4" stroke-opacity="0.75" />

  <!-- mark -->
  <g transform="translate(100,82) scale(1.05) translate(-50,-38.25)">
    <path d="M 13 66 L 30 46 L 40 56 L 50 31 L 62 47 L 71 39 L 87 66 Z" fill="url(#chRidge-d)" />
    <path d="M 13 66 L 30 46 L 40 56 L 50 31 L 62 47 L 71 39 L 87 66"
          stroke="url(#chGold-d)" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round" />
    <path d="M 50 31 L 56 39 L 53.5 37 L 51 40 L 48.5 36.5 L 46.5 39.75 Z" fill="url(#chGold-d)" fill-opacity="0.85" />
    <line x1="13" y1="66" x2="87" y2="66" stroke="url(#chGold-d)" stroke-width="2" stroke-linecap="round" />
    <polygon points="50,10.5 50.80,16.06 53.54,14.46 51.94,17.20 57.5,18 51.94,18.80 53.54,21.54 50.80,19.94 50,25.5 49.20,19.94 46.46,21.54 48.06,18.80 42.5,18 48.06,17.20 46.46,14.46 49.20,16.06"
             fill="url(#chGold-d)" />
    <circle cx="50" cy="18" r="1.05" fill="#FFF5E0" />
  </g>

  <!-- wordmark only: a tagline is unreadable at avatar sizes and would breach the circle -->
  <text x="100" y="150" text-anchor="middle"
        font-family="'Playfair Display', Georgia, 'Times New Roman', serif"
        font-size="16" font-weight="600" letter-spacing="2"
        fill="url(#chGold-d)">CELESTIA INN</text>

  <polygon points="100,166 102.2,163.8 104.4,166 102.2,168.2" fill="url(#chGold-d)" fill-opacity="0.65"
           transform="translate(-2.2,0)" />
</svg>
