    <path d="M 50 31 L 56 39 L 53.5 37 L 51 40 L 48.5 36.5 L 46.5 39.75 Z" fill="url(#chGold-f)" />
    <line x1="13" y1="66" x2="87" y2="66" stroke="url(#chGold-f)" stroke-width="4.4" stroke-linecap="round" />
    <polygon points="50,7.5 51.1,15.3 55.0,13.1 52.8,17.0 60.6,18 52.8,19.0 55.0,22.9 51.1,20.7 50,28.5 48.9,20.7 45.0,22.9 47.2,19.0 39.4,18 47.2,17.0 45.0,13.1 48.9,15.3"
