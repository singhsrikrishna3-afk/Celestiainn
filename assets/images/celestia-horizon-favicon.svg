  <circle cx="32" cy="32" r="32" fill="url(#chDisc-f)" />

  <!-- the roundel's centre device at its native proportions (scale 0.64), so the
       ring and the range sit exactly as they do in the full logo. The curved
       legends and the hairline ring are dropped: both turn to noise below ~90px. -->
  <g transform="scale(0.64)">
    <circle cx="50" cy="50" r="46" stroke="url(#chGold-f)" stroke-width="3.3" />
    <path d="M 13 66 L 30 46 L 40 56 L 50 31 L 62 47 L 71 39 L 87 66 Z" fill="url(#chRidge-f)" />
    <path d="M 13 66 L 30 46 L 40 56 L 50 31 L 62 47 L 71 39 L 87 66"
