<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" role="img" aria-label="Celestia Inn">
  <defs>
    <linearGradient id="chGold-f" x1="10%" y1="0%" x2="90%" y2="100%">
      <stop offset="0%" stop-color="#FFF5E0" />
      <stop offset="38%" stop-color="#E9C176" />
      <stop offset="78%" stop-color="#C5A059" />
      <stop offset="100%" stop-color="#9E7831" />
    </linearGradient>
    <linearGradient id="chRidge-f" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E9C176" stop-opacity="0.42" />
      <stop offset="100%" stop-color="#9E7831" stop-opacity="0.08" />
