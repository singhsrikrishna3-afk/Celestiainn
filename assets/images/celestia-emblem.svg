<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none" class="celestia-emblem-svg">
  <defs>
    <!-- Rich Metallic Gold Linear Gradient -->
    <linearGradient id="celestiaGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF2D6" />
      <stop offset="25%" stop-color="#E9C176" />
      <stop offset="50%" stop-color="#C5A059" />
      <stop offset="75%" stop-color="#FFDEA5" />
      <stop offset="100%" stop-color="#9E7831" />
    </linearGradient>

    <!-- Radiance Gradient for Star Glow -->
    <radialGradient id="starGlow" cx="50%" cy="36%" r="40%">
      <stop offset="0%" stop-color="#FFE7B3" stop-opacity="0.3" />
      <stop offset="60%" stop-color="#E9C176" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#C5A059" stop-opacity="0" />
    </radialGradient>

    <!-- Star Fill Gradient (Faceted Light/Dark) -->
    <linearGradient id="facetLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF5E0" />
      <stop offset="100%" stop-color="#E9C176" />
    </linearGradient>
    <linearGradient id="facetDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C5A059" />
      <stop offset="100%" stop-color="#805B1E" />
    </linearGradient>
    <linearGradient id="facetMid" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFDEA5" />
      <stop offset="100%" stop-color="#B3893C" />
    </linearGradient>

    <!-- Drop Shadow Filter for Luxury Depth -->
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Background Radiance Glow -->
  <circle cx="50%" cy="36%" r="28" fill="url(#starGlow)" />

  <!-- Outer Celestial Ring with Astral Ticks -->
  <circle cx="50" cy="50" r="46" stroke="url(#celestiaGoldGrad)" stroke-width="1.2" stroke-opacity="0.85" filter="url(#goldGlow)" />
  <circle cx="50" cy="50" r="43" stroke="url(#celestiaGoldGrad)" stroke-width="0.6" stroke-dasharray="1.5 3.5" stroke-opacity="0.6" />

  <!-- Outer Cardinal Accent Diamonds -->
  <polygon points="50,2 51.5,4 50,6 48.5,4" fill="url(#celestiaGoldGrad)" />
  <polygon points="50,94 51.5,96 50,98 48.5,96" fill="url(#celestiaGoldGrad)" />
  <polygon points="2,50 4,51.5 6,50 4,48.5" fill="url(#celestiaGoldGrad)" />
  <polygon points="94,50 96,51.5 98,50 96,48.5" fill="url(#celestiaGoldGrad)" />

  <!-- Architectural Sanctuary Archway (Inn Portal) -->
  <!-- Outer Archway Profile -->
  <path d="M 23 80 L 23 48 C 23 33.088 35.088 21 50 21 C 64.912 21 77 33.088 77 48 L 77 80" 
        stroke="url(#celestiaGoldGrad)" stroke-width="1.2" stroke-linecap="round" fill="none" filter="url(#goldGlow)" />

  <!-- Inner Architectural Arch Rib -->
  <path d="M 29 80 L 29 49 C 29 37.402 38.402 28 50 28 C 61.598 28 71 37.402 71 49 L 71 80" 
        stroke="url(#celestiaGoldGrad)" stroke-width="0.8" stroke-dasharray="0.5 2.5" stroke-linecap="round" fill="none" stroke-opacity="0.75" />

  <!-- Keystones / Arch Finial Peak -->
  <path d="M 50 14 L 52.5 19 L 50 21 L 47.5 19 Z" fill="url(#celestiaGoldGrad)" filter="url(#goldGlow)" />
  <circle cx="50" cy="12" r="1.2" fill="url(#celestiaGoldGrad)" />

  <!-- Alpine Base Foundation & Horizon Pedestal -->
  <line x1="18" y1="80" x2="82" y2="80" stroke="url(#celestiaGoldGrad)" stroke-width="1.5" stroke-linecap="round" />
  <line x1="26" y1="83" x2="74" y2="83" stroke="url(#celestiaGoldGrad)" stroke-width="0.75" stroke-linecap="round" stroke-opacity="0.7" />

  <!-- Himalayan Mountain Ridge (Grounded Earth & Shangarh Valley Ridges) -->
  <polygon points="18,80 34,64 45,74 58,60 72,73 82,80" fill="url(#facetDark)" fill-opacity="0.4" />
  <path d="M 20 80 L 35 65 L 45 74 L 58 61 L 71 73 L 80 80" 
        stroke="url(#celestiaGoldGrad)" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round" fill="none" />
  <!-- Shadow facets on mountain peaks -->
  <polygon points="35,65 45,74 41,74" fill="url(#facetDark)" fill-opacity="0.6" />
  <polygon points="58,61 66,73 63,73" fill="url(#facetDark)" fill-opacity="0.6" />

  <!-- The Celestial Polaris Star (Guiding Light of Celestia) -->
  <!-- Center at (50, 40) -->
  <g transform="translate(0, -2)" filter="url(#goldGlow)">
    <!-- Vertical North Ray -->
    <polygon points="50,42 47.5,42 50,19" fill="url(#facetLight)" />
    <polygon points="50,42 52.5,42 50,19" fill="url(#facetDark)" />

    <!-- Vertical South Ray -->
    <polygon points="50,42 47.5,42 50,60" fill="url(#facetMid)" />
    <polygon points="50,42 52.5,42 50,60" fill="url(#facetLight)" />

    <!-- Horizontal West Ray -->
    <polygon points="50,42 50,39.5 28,42" fill="url(#facetLight)" />
    <polygon points="50,42 50,44.5 28,42" fill="url(#facetDark)" />

    <!-- Horizontal East Ray -->
    <polygon points="50,42 50,39.5 72,42" fill="url(#facetMid)" />
    <polygon points="50,42 50,44.5 72,42" fill="url(#facetLight)" />

    <!-- Diagonal NW Ray -->
    <polygon points="50,42 48.5,40.5 36,28" fill="url(#facetLight)" />
    <polygon points="50,42 50.5,43.5 36,28" fill="url(#facetDark)" />

    <!-- Diagonal NE Ray -->
    <polygon points="50,42 51.5,40.5 64,28" fill="url(#facetMid)" />
    <polygon points="50,42 49.5,43.5 64,28" fill="url(#facetLight)" />

    <!-- Diagonal SW Ray -->
    <polygon points="50,42 48.5,43.5 37,54" fill="url(#facetDark)" />
    <polygon points="50,42 50.5,40.5 37,54" fill="url(#facetLight)" />

    <!-- Diagonal SE Ray -->
    <polygon points="50,42 51.5,43.5 63,54" fill="url(#facetLight)" />
    <polygon points="50,42 49.5,40.5 63,54" fill="url(#facetMid)" />

    <!-- Center Diamond Flare -->
    <polygon points="50,38.5 53.5,42 50,45.5 46.5,42" fill="url(#facetLight)" />
    <circle cx="50" cy="42" r="1.5" fill="#FFFFFF" />
  </g>

  <!-- Constellation Accent Stars in the Celestial Sky -->
  <circle cx="34" cy="32" r="0.9" fill="#FFF2D6" />
  <circle cx="66" cy="32" r="0.9" fill="#FFF2D6" />
  <circle cx="30" cy="44" r="0.75" fill="#FFE7B3" />
  <circle cx="70" cy="44" r="0.75" fill="#FFE7B3" />
  <circle cx="40" cy="24" r="0.65" fill="#FFF2D6" />
  <circle cx="60" cy="24" r="0.65" fill="#FFF2D6" />
</svg>
