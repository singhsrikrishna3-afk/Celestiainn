<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none" role="img" aria-label="Celestia Inn — Homestays &amp; Boutique Inns">
  <defs>
    <linearGradient id="chGold-r" x1="8%" y1="0%" x2="92%" y2="100%">
      <stop offset="0%" stop-color="#FFF2D6" />
      <stop offset="28%" stop-color="#E9C176" />
      <stop offset="62%" stop-color="#C5A059" />
      <stop offset="84%" stop-color="#FFDEA5" />
      <stop offset="100%" stop-color="#9E7831" />
    </linearGradient>
    <linearGradient id="chRidge-r" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E9C176" stop-opacity="0.30" />
      <stop offset="100%" stop-color="#9E7831" stop-opacity="0.06" />
    </linearGradient>
    <radialGradient id="chSky-r" cx="50%" cy="30%" r="55%">
      <stop offset="0%" stop-color="#FFE7B3" stop-opacity="0.16" />
      <stop offset="100%" stop-color="#C5A059" stop-opacity="0" />
    </radialGradient>

    <!-- type baselines: top arc runs over the top, bottom arc under the bottom -->
    <path id="chArcTop-r" d="M 22,100 A 78,78 0 0,1 178,100" />
    <path id="chArcBot-r" d="M 24,100 A 76,76 0 0,0 176,100" />
  </defs>

  <circle cx="100" cy="100" r="86" fill="url(#chSky-r)" />

  <!-- rings -->
  <circle cx="100" cy="100" r="96" stroke="url(#chGold-r)" stroke-width="2" />
  <circle cx="100" cy="100" r="90.5" stroke="url(#chGold-r)" stroke-width="0.7" stroke-opacity="0.45" />
  <circle cx="100" cy="100" r="63" stroke="url(#chGold-r)" stroke-width="0.9" stroke-opacity="0.55" />

  <!-- curved type -->
  <text font-family="'Playfair Display', Georgia, 'Times New Roman', serif"
        font-size="19" font-weight="600" letter-spacing="4.2" fill="url(#chGold-r)">
    <textPath href="#chArcTop-r" startOffset="50%" text-anchor="middle">CELESTIA INN</textPath>
  </text>
  <text font-family="'Manrope', -apple-system, BlinkMacSystemFont, sans-serif"
        font-size="8" font-weight="500" letter-spacing="3" fill="#D1C5B4" fill-opacity="0.88">
    <textPath href="#chArcBot-r" startOffset="50%" text-anchor="middle">HOMESTAYS &amp; BOUTIQUE INNS</textPath>
  </text>

  <!-- separators at 9 and 3 o'clock -->
  <polygon points="22.5,100 26,96.5 29.5,100 26,103.5" fill="url(#chGold-r)" fill-opacity="0.9" />
  <polygon points="170.5,100 174,96.5 177.5,100 174,103.5" fill="url(#chGold-r)" fill-opacity="0.9" />

  <!-- centre device -->
  <g transform="translate(100,100) scale(1.12) translate(-50,-38.25)">
    <path d="M 13 66 L 30 46 L 40 56 L 50 31 L 62 47 L 71 39 L 87 66 Z" fill="url(#chRidge-r)" />
    <path d="M 13 66 L 30 46 L 40 56 L 50 31 L 62 47 L 71 39 L 87 66"
          stroke="url(#chGold-r)" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" />
    <path d="M 50 31 L 56 39 L 53.5 37 L 51 40 L 48.5 36.5 L 46.5 39.75 Z" fill="url(#chGold-r)" fill-opacity="0.85" />
    <line x1="13" y1="66" x2="87" y2="66" stroke="url(#chGold-r)" stroke-width="1.9" stroke-linecap="round" />
    <polygon points="50,10.5 50.80,16.06 53.54,14.46 51.94,17.20 57.5,18 51.94,18.80 53.54,21.54 50.80,19.94 50,25.5 49.20,19.94 46.46,21.54 48.06,18.80 42.5,18 48.06,17.20 46.46,14.46 49.20,16.06"
             fill="url(#chGold-r)" />
    <circle cx="50" cy="18" r="1.05" fill="#FFF5E0" />
  </g>
</svg>
