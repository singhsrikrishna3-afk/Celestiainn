<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 280" fill="none">
  <!-- Clean Artisanal Charcoal & Himalayan Stone Monoline -->
  <g transform="translate(160, 85)">
    <!-- Organic Hand-Drawn Double Ring -->
    <circle cx="0" cy="0" r="68" stroke="#1D201F" stroke-width="2.2" stroke-linecap="round" />
    <circle cx="0" cy="0" r="62" stroke="#484C49" stroke-width="1.0" stroke-dasharray="2 3" opacity="0.7" />

    <!-- Mountain Peaks -->
    <!-- Contours & Hatching -->
    <path d="M -54 34 L -36 12 L -16 -8 L 0 -22 L 16 -8 L 36 12 L 54 34" 
          stroke="#1D201F" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Left Mountain Shading -->
    <polygon points="-36,12 -16,-8 -4,22 -20,28" fill="#D3D0CA" opacity="0.6" />
    <polygon points="-16,-8 0,-22 0,50 -18,26" fill="#88857E" opacity="0.5" />
    
    <!-- Central Ridge Line -->
    <line x1="0" y1="-22" x2="0" y2="52" stroke="#1D201F" stroke-width="1.6" stroke-linecap="round" />
    
    <!-- Right Mountain Shading -->
    <polygon points="0,-22 16,-8 20,28 0,50" fill="#2E3230" opacity="0.8" />
    <polygon points="16,-8 36,12 48,34 24,30" fill="#4B504D" opacity="0.7" />

    <!-- Ridge lines -->
    <line x1="-36" y1="12" x2="-20" y2="28" stroke="#1D201F" stroke-width="1.2" />
    <line x1="16" y1="-8" x2="0" y2="24" stroke="#1D201F" stroke-width="1.2" />
    <line x1="36" y1="12" x2="20" y2="28" stroke="#1D201F" stroke-width="1.2" />

    <path d="M -50 36 C -32 54 -16 62 0 62 C 16 62 32 54 50 36" 
          stroke="#1D201F" stroke-width="1.8" fill="none" />

    <!-- Celestial 8-Pointed Star -->
    <g transform="translate(0, -22)">
      <!-- North Ray -->
      <polygon points="0,0 -3,0 0,-32" fill="#1D201F" />
      <polygon points="0,0 3,0 0,-32" fill="#484C49" />

      <!-- South Ray -->
      <polygon points="0,0 -2.5,0 0,16" fill="#484C49" />
      <polygon points="0,0 2.5,0 0,16" fill="#1D201F" />

      <!-- West Ray -->
      <polygon points="0,0 0,-3 -26,0" fill="#1D201F" />
      <polygon points="0,0 0,3 -26,0" fill="#484C49" />

      <!-- East Ray -->
      <polygon points="0,0 0,-3 26,0" fill="#484C49" />
      <polygon points="0,0 0,3 26,0" fill="#1D201F" />

      <!-- Diagonals -->
      <polygon points="0,0 -2,-2 -15,-15" fill="#1D201F" />
      <polygon points="0,0 2,-2 -15,-15" fill="#484C49" />
      <polygon points="0,0 2,-2 15,-15" fill="#484C49" />
      <polygon points="0,0 -2,-2 15,-15" fill="#1D201F" />
      <polygon points="0,0 -2,2 -13,13" fill="#484C49" />
      <polygon points="0,0 2,2 -13,13" fill="#1D201F" />
      <polygon points="0,0 2,2 13,13" fill="#1D201F" />
      <polygon points="0,0 -2,2 13,13" fill="#484C49" />

      <circle cx="0" cy="0" r="1.5" fill="#FFFFFF" stroke="#1D201F" stroke-width="0.8" />
    </g>
  </g>

  <!-- Typography in Deep Mineral Charcoal -->
  <text x="160" y="198" 
        text-anchor="middle"
        font-family="'Playfair Display', Georgia, serif" 
        font-size="28" 
        font-weight="700" 
        letter-spacing="4" 
        fill="#1D201F">CELESTIA INN</text>

  <line x1="60" y1="214" x2="140" y2="214" stroke="#484C49" stroke-width="0.8" opacity="0.6" />
  <polygon points="160,210 163,214 160,218 157,214" fill="#1D201F" />
  <line x1="180" y1="214" x2="260" y2="214" stroke="#484C49" stroke-width="0.8" opacity="0.6" />

  <text x="160" y="234" 
        text-anchor="middle"
        font-family="'Manrope', -apple-system, sans-serif" 
        font-size="9.5" 
        font-weight="600" 
        letter-spacing="4" 
        fill="#555956">HOMESTAYS &amp; BOUTIQUE INNS</text>
</svg>
