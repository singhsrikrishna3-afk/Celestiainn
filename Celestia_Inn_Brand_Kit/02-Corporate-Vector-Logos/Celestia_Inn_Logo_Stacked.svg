<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 280" fill="none">
  <defs>
    <linearGradient id="stkGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF5E0" />
      <stop offset="20%" stop-color="#F2D396" />
      <stop offset="45%" stop-color="#E2B867" />
      <stop offset="70%" stop-color="#C59A45" />
      <stop offset="90%" stop-color="#FFDEA5" />
      <stop offset="100%" stop-color="#8C661D" />
    </linearGradient>

    <linearGradient id="mtnDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#B3893C" />
      <stop offset="50%" stop-color="#735114" />
      <stop offset="100%" stop-color="#422D08" />
    </linearGradient>

    <linearGradient id="mtnLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF9ED" />
      <stop offset="40%" stop-color="#E9C176" />
      <stop offset="100%" stop-color="#C59A45" />
    </linearGradient>

    <radialGradient id="stkRadial" cx="50%" cy="36%" r="35%">
      <stop offset="0%" stop-color="#FFF5E0" stop-opacity="0.4" />
      <stop offset="50%" stop-color="#E9C176" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#E9C176" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="fHi" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F5D491" />
    </linearGradient>
    <linearGradient id="fShade" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#B88E3E" />
      <stop offset="100%" stop-color="#6E4C11" />
    </linearGradient>

    <filter id="shadowFilter" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- ================= EMBLEM (CENTERED, Scale 0.72) ================= -->
  <g transform="translate(78, 12) scale(0.72)" filter="url(#shadowFilter)">
    <!-- Circular Frame -->
    <circle cx="100" cy="100" r="95" stroke="url(#stkGold)" stroke-width="2.5" />
    <circle cx="100" cy="100" r="88" stroke="url(#stkGold)" stroke-width="1.2" stroke-dasharray="2 3" stroke-opacity="0.75" />
    <circle cx="100" cy="100" r="84" stroke="url(#stkGold)" stroke-width="0.75" stroke-opacity="0.45" />

    <!-- Cardinal Diamond Ticks -->
    <polygon points="100,1 102.5,5 100,9 97.5,5" fill="url(#stkGold)" />
    <polygon points="100,191 102.5,195 100,199 97.5,195" fill="url(#stkGold)" />
    <polygon points="1,100 5,102.5 9,100 5,97.5" fill="url(#stkGold)" />
    <polygon points="191,100 195,102.5 199,100 195,97.5" fill="url(#stkGold)" />

    <!-- Glow Backdrop -->
    <circle cx="100" cy="72" r="50" fill="url(#stkRadial)" />

    <!-- Astral Orbit Arcs -->
    <path d="M 42 66 C 54 44 76 34 100 34 C 124 34 146 44 158 66" 
          stroke="url(#stkGold)" stroke-width="1" stroke-dasharray="1.5 3.5" stroke-linecap="round" stroke-opacity="0.8" />
    <path d="M 32 82 C 46 48 70 30 100 30 C 130 30 154 48 168 82" 
          stroke="url(#stkGold)" stroke-width="0.6" stroke-linecap="round" stroke-opacity="0.45" />

    <!-- Constellation Stars -->
    <circle cx="48" cy="56" r="1.3" fill="#FFF5E0" />
    <circle cx="62" cy="42" r="1.8" fill="#FFF5E0" />
    <circle cx="80" cy="35" r="1.2" fill="#FFE7B3" />
    <circle cx="120" cy="35" r="1.2" fill="#FFE7B3" />
    <circle cx="138" cy="42" r="1.8" fill="#FFF5E0" />
    <circle cx="152" cy="56" r="1.3" fill="#FFF5E0" />
    <circle cx="100" cy="24" r="1.6" fill="#FFF5E0" />

    <!-- Mountains -->
    <polygon points="18,138 46,110 68,132 40,154 22,142" fill="url(#mtnDark)" />
    <polygon points="46,110 68,132 54,142 36,124" fill="url(#mtnLight)" />
    <polygon points="182,138 154,110 132,132 160,154 178,142" fill="url(#mtnLight)" />
    <polygon points="154,110 132,132 146,142 164,124" fill="url(#mtnDark)" />
    <polygon points="46,110 74,86 98,124 68,132" fill="url(#mtnLight)" />
    <polygon points="74,86 98,124 82,144 58,122" fill="url(#mtnDark)" />
    <polygon points="154,110 126,86 102,124 132,132" fill="url(#mtnDark)" />
    <polygon points="126,86 102,124 118,144 142,122" fill="url(#mtnLight)" />
    <polygon points="100,72 68,132 100,165" fill="url(#mtnLight)" />
    <polygon points="100,72 132,132 100,165" fill="url(#mtnDark)" />
    <polygon points="100,72 96,112 100,165 104,112" fill="url(#fHi)" opacity="0.6" />

    <!-- Mountain Crest Lines -->
    <path d="M 22 142 L 46 110 L 74 86 L 100 72 L 126 86 L 154 110 L 178 142" 
          stroke="url(#stkGold)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 100 72 L 100 165" stroke="url(#stkGold)" stroke-width="1.2" stroke-linecap="round" />
    <path d="M 24 144 C 44 172 70 186 100 186 C 130 186 156 172 176 144" 
          stroke="url(#stkGold)" stroke-width="1.8" fill="none" />

    <!-- Radiant Celestial Star -->
    <g transform="translate(100, 72)">
      <polygon points="0,0 -4,0 0,-44" fill="url(#fHi)" />
      <polygon points="0,0 4,0 0,-44" fill="url(#fShade)" />
      <polygon points="0,0 -3.5,0 0,26" fill="url(#fShade)" />
      <polygon points="0,0 3.5,0 0,26" fill="url(#fHi)" />
      <polygon points="0,0 0,-4 -36,0" fill="url(#fHi)" />
      <polygon points="0,0 0,4 -36,0" fill="url(#fShade)" />
      <polygon points="0,0 0,-4 36,0" fill="url(#fShade)" />
      <polygon points="0,0 0,4 36,0" fill="url(#fHi)" />
      <polygon points="0,0 -2.5,-2.5 -22,-22" fill="url(#fHi)" />
      <polygon points="0,0 2.5,-2.5 -22,-22" fill="url(#fShade)" />
      <polygon points="0,0 2.5,-2.5 22,-22" fill="url(#fShade)" />
      <polygon points="0,0 -2.5,-2.5 22,-22" fill="url(#fHi)" />
      <polygon points="0,0 -2.5,2.5 -18,18" fill="url(#fShade)" />
      <polygon points="0,0 2.5,2.5 -18,18" fill="url(#fHi)" />
      <polygon points="0,0 2.5,2.5 18,18" fill="url(#fHi)" />
      <polygon points="0,0 -2.5,2.5 18,18" fill="url(#fShade)" />
      <polygon points="0,-5 5,0 0,5 -5,0" fill="url(#stkGold)" />
      <circle cx="0" cy="0" r="2" fill="#FFFFFF" />
    </g>
  </g>

  <!-- ================= TYPOGRAPHY (CENTERED) ================= -->
  <!-- Brand Wordmark -->
  <text x="150" y="200" 
        text-anchor="middle"
        font-family="'Playfair Display', Georgia, serif" 
        font-size="28" 
        font-weight="600" 
        letter-spacing="4" 
        fill="url(#stkGold)"
        filter="url(#shadowFilter)">CELESTIA INN</text>

  <!-- Refined Center Divider Line with Star Accent -->
  <line x1="45" y1="216" x2="135" y2="216" stroke="url(#stkGold)" stroke-width="0.8" stroke-opacity="0.5" />
  <polygon points="150,212 153,216 150,220 147,216" fill="url(#stkGold)" />
  <line x1="165" y1="216" x2="255" y2="216" stroke="url(#stkGold)" stroke-width="0.8" stroke-opacity="0.5" />

  <!-- Subtitle Tagline -->
  <text x="150" y="238" 
        text-anchor="middle"
        font-family="'Manrope', -apple-system, sans-serif" 
        font-size="9" 
        font-weight="600" 
        letter-spacing="4.5" 
        fill="#D1C5B4">HOMESTAYS &amp; BOUTIQUE INNS</text>

  <text x="150" y="258" 
        text-anchor="middle"
        font-family="'Playfair Display', Georgia, serif" 
        font-style="italic"
        font-size="9.5" 
        letter-spacing="1.5"
        fill="#E9C176" 
        opacity="0.75">&bull; Shangarh &bull; Kullu &bull; India &bull;</text>
</svg>
