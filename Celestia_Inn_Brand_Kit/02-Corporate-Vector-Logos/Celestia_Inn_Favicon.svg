<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="favGold3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF5E0" />
      <stop offset="35%" stop-color="#E9C176" />
      <stop offset="100%" stop-color="#C59A45" />
    </linearGradient>
    <linearGradient id="favMtn" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8C661D" />
      <stop offset="100%" stop-color="#3D2906" />
    </linearGradient>
  </defs>

  <!-- Square Base with Rounded Corners -->
  <rect width="64" height="64" rx="14" fill="#141210" />
  <rect x="1.5" y="1.5" width="61" height="61" rx="12.5" stroke="url(#favGold3)" stroke-width="1.2" stroke-opacity="0.5" />

  <!-- Circular Outer Medallion -->
  <circle cx="32" cy="32" r="26" stroke="url(#favGold3)" stroke-width="1.2" />

  <!-- Mountain Peaks -->
  <polygon points="12,46 22,35 32,43 25,48" fill="url(#favMtn)" />
  <polygon points="52,46 42,35 32,43 39,48" fill="#C59A45" />
  <polygon points="22,35 32,24 42,35 32,43" fill="url(#favMtn)" />
  <polygon points="32,24 42,35 32,46" fill="#E9C176" />
  <path d="M 12 46 L 22 35 L 32 24 L 42 35 L 52 46" stroke="url(#favGold3)" stroke-width="1.4" stroke-linejoin="round" />
  <line x1="32" y1="24" x2="32" y2="46" stroke="url(#favGold3)" stroke-width="1.2" />

  <!-- Radiant Star at Apex -->
  <g transform="translate(32, 24)">
    <polygon points="0,-12 1.5,-2 0,0 -1.5,-2" fill="#FFFFFF" />
    <polygon points="0,8 1.5,2 0,0 -1.5,2" fill="#C59A45" />
    <polygon points="-10,0 -2,-1.5 0,0 -2,1.5" fill="#E9C176" />
    <polygon points="10,0 2,-1.5 0,0 2,1.5" fill="#FFFFFF" />
    <polygon points="-6,-6 -1,-2 0,0 -2,-1" fill="#E9C176" />
    <polygon points="6,-6 1,-2 0,0 2,-1" fill="#FFE7B3" />
    <polygon points="-5,5 -1,2 0,0 -2,1" fill="#C59A45" />
    <polygon points="5,5 1,2 0,0 2,1" fill="#E9C176" />
    <circle cx="0" cy="0" r="1.3" fill="#FFFFFF" />
  </g>

  <!-- Constellation points -->
  <circle cx="20" cy="18" r="0.9" fill="#FFF5E0" />
  <circle cx="44" cy="18" r="0.9" fill="#FFF5E0" />
  <circle cx="32" cy="10" r="1.1" fill="#FFF5E0" />
</svg>
