<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 84" fill="none">
  <defs>
    <linearGradient id="hzGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF5E0" />
      <stop offset="20%" stop-color="#F2D396" />
      <stop offset="45%" stop-color="#E2B867" />
      <stop offset="70%" stop-color="#C59A45" />
      <stop offset="90%" stop-color="#FFDEA5" />
      <stop offset="100%" stop-color="#8C661D" />
    </linearGradient>

    <linearGradient id="hzMtnDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#B3893C" />
      <stop offset="50%" stop-color="#735114" />
      <stop offset="100%" stop-color="#422D08" />
    </linearGradient>

    <linearGradient id="hzMtnLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF9ED" />
      <stop offset="40%" stop-color="#E9C176" />
      <stop offset="100%" stop-color="#C59A45" />
    </linearGradient>

    <radialGradient id="hzRadial" cx="50%" cy="36%" r="35%">
      <stop offset="0%" stop-color="#FFF5E0" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#E9C176" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="hzHi" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F5D491" />
    </linearGradient>
    <linearGradient id="hzShade" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#B88E3E" />
      <stop offset="100%" stop-color="#6E4C11" />
    </linearGradient>

    <filter id="hzShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- ================= LEFT EMBLEM (72x72 at x=6, y=6) ================= -->
  <g transform="translate(6, 6) scale(0.36)" filter="url(#hzShadow)">
    <circle cx="100" cy="100" r="95" stroke="url(#hzGold)" stroke-width="2.8" />
    <circle cx="100" cy="100" r="88" stroke="url(#hzGold)" stroke-width="1.3" stroke-dasharray="2 3" stroke-opacity="0.75" />
    <circle cx="100" cy="100" r="84" stroke="url(#hzGold)" stroke-width="0.8" stroke-opacity="0.45" />

    <polygon points="100,1 102.5,5 100,9 97.5,5" fill="url(#hzGold)" />
    <polygon points="100,191 102.5,195 100,199 97.5,195" fill="url(#hzGold)" />
    <polygon points="1,100 5,102.5 9,100 5,97.5" fill="url(#hzGold)" />
    <polygon points="191,100 195,102.5 199,100 195,97.5" fill="url(#hzGold)" />

    <circle cx="100" cy="72" r="50" fill="url(#hzRadial)" />

    <path d="M 42 66 C 54 44 76 34 100 34 C 124 34 146 44 158 66" 
          stroke="url(#hzGold)" stroke-width="1.2" stroke-dasharray="1.5 3.5" stroke-linecap="round" stroke-opacity="0.8" />

    <circle cx="48" cy="56" r="1.5" fill="#FFF5E0" />
    <circle cx="62" cy="42" r="2.0" fill="#FFF5E0" />
    <circle cx="80" cy="35" r="1.5" fill="#FFE7B3" />
    <circle cx="120" cy="35" r="1.5" fill="#FFE7B3" />
    <circle cx="138" cy="42" r="2.0" fill="#FFF5E0" />
    <circle cx="152" cy="56" r="1.5" fill="#FFF5E0" />
    <circle cx="100" cy="24" r="1.8" fill="#FFF5E0" />

    <polygon points="18,138 46,110 68,132 40,154 22,142" fill="url(#hzMtnDark)" />
    <polygon points="46,110 68,132 54,142 36,124" fill="url(#hzMtnLight)" />
    <polygon points="182,138 154,110 132,132 160,154 178,142" fill="url(#hzMtnLight)" />
    <polygon points="154,110 132,132 146,142 164,124" fill="url(#hzMtnDark)" />
    <polygon points="46,110 74,86 98,124 68,132" fill="url(#hzMtnLight)" />
    <polygon points="74,86 98,124 82,144 58,122" fill="url(#hzMtnDark)" />
    <polygon points="154,110 126,86 102,124 132,132" fill="url(#hzMtnDark)" />
    <polygon points="126,86 102,124 118,144 142,122" fill="url(#hzMtnLight)" />
    <polygon points="100,72 68,132 100,165" fill="url(#hzMtnLight)" />
    <polygon points="100,72 132,132 100,165" fill="url(#hzMtnDark)" />
    <polygon points="100,72 96,112 100,165 104,112" fill="url(#hzHi)" opacity="0.6" />

    <path d="M 22 142 L 46 110 L 74 86 L 100 72 L 126 86 L 154 110 L 178 142" 
          stroke="url(#hzGold)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 100 72 L 100 165" stroke="url(#hzGold)" stroke-width="1.5" stroke-linecap="round" />
    <path d="M 24 144 C 44 172 70 186 100 186 C 130 186 156 172 176 144" 
          stroke="url(#hzGold)" stroke-width="2.2" fill="none" />

    <g transform="translate(100, 72)">
      <polygon points="0,0 -4,0 0,-44" fill="url(#hzHi)" />
      <polygon points="0,0 4,0 0,-44" fill="url(#hzShade)" />
      <polygon points="0,0 -3.5,0 0,26" fill="url(#hzShade)" />
      <polygon points="0,0 3.5,0 0,26" fill="url(#hzHi)" />
      <polygon points="0,0 0,-4 -36,0" fill="url(#hzHi)" />
      <polygon points="0,0 0,4 -36,0" fill="url(#hzShade)" />
      <polygon points="0,0 0,-4 36,0" fill="url(#hzShade)" />
      <polygon points="0,0 0,4 36,0" fill="url(#hzHi)" />
      <polygon points="0,0 -2.5,-2.5 -22,-22" fill="url(#hzHi)" />
      <polygon points="0,0 2.5,-2.5 -22,-22" fill="url(#hzShade)" />
      <polygon points="0,0 2.5,-2.5 22,-22" fill="url(#hzShade)" />
      <polygon points="0,0 -2.5,-2.5 22,-22" fill="url(#hzHi)" />
      <polygon points="0,0 -2.5,2.5 -18,18" fill="url(#hzShade)" />
      <polygon points="0,0 2.5,2.5 -18,18" fill="url(#hzHi)" />
      <polygon points="0,0 2.5,2.5 18,18" fill="url(#hzHi)" />
      <polygon points="0,0 -2.5,2.5 18,18" fill="url(#hzShade)" />
      <polygon points="0,-5 5,0 0,5 -5,0" fill="url(#hzGold)" />
      <circle cx="0" cy="0" r="2.5" fill="#FFFFFF" />
    </g>
  </g>

  <!-- ================= RIGHT TYPOGRAPHY LOCKUP ================= -->
  <text x="96" y="44" 
        font-family="'Playfair Display', Georgia, serif" 
        font-size="30" 
        font-weight="600" 
        letter-spacing="4" 
        fill="url(#hzGold)"
        filter="url(#hzShadow)">CELESTIA INN</text>

  <!-- Divider Line with Diamond Accent -->
  <line x1="96" y1="55" x2="216" y2="55" stroke="url(#hzGold)" stroke-width="0.8" stroke-opacity="0.5" />
  <polygon points="222,55 224,53 226,55 224,57" fill="url(#hzGold)" />
  <line x1="232" y1="55" x2="395" y2="55" stroke="url(#hzGold)" stroke-width="0.8" stroke-opacity="0.5" />

  <!-- Subtitle -->
  <text x="96" y="70" 
        font-family="'Manrope', -apple-system, sans-serif" 
        font-size="10.5" 
        font-weight="600" 
        letter-spacing="4.5" 
        fill="#D1C5B4">HOMESTAYS &amp; BOUTIQUE INNS</text>
</svg>
